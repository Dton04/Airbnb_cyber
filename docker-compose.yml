services:
  redis:
    image: redis:alpine
    container_name: airbnb-redis
    restart: always
    ports:
      - "6380:6379"

  app:
    build: .
    container_name: airbnb-api
    restart: always
    ports:
      - "3069:3069"
    env_file:
      - .env
    environment:
      # REDIS_URL sẽ được override để dùng container nội bộ
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
